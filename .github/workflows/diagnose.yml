name: Diagnostic Workflow

on:
  push:
    branches: [ diagnose ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::740163003247:role/HRMSGitHubActionsDeploy
          aws-region: ap-south-1

      - name: Run SSM Diagnostic
        run: |
          INSTANCE_ID="i-0e863c438fd66fd31"
          
          # Create the SSM payload using the exact same structure as ci.yml
          cat << 'EOF' > ssm_payload.json
          {
            "commands": [
              "sudo -u ubuntu -H bash -e << 'DIAG'",
              "echo '=== DIAGNOSTIC START ==='",
              "cd /home/ubuntu/HRMS",
              "echo '=== GIT STATE ==='",
              "git rev-parse HEAD",
              "git rev-parse origin/main",
              "git status --short",
              "echo '=== LATEST EXCEPTION ==='",
              "grep -n -A 8 -B 8 \"AI Service Exception\" /home/ubuntu/HRMS/hrm-backend/storage/logs/laravel.log | tail -n 80 || true",
              "echo '=== ALL GEMINI ERRORS ==='",
              "grep -n -A 8 -B 8 -Ei \"Gemini|AI Service|429|503|quota|retry|exception\" /home/ubuntu/HRMS/hrm-backend/storage/logs/laravel.log | tail -n 120 || true",
              "echo '=== GEMINI CONFIG ==='",
              "grep -E \"^(GEMINI_MODEL|GEMINI_API_KEY)=\" /home/ubuntu/HRMS/hrm-backend/.env | sed -E 's/=.*/=***exists***/' || true",
              "echo '=== DIAGNOSTIC END ==='",
              "DIAG"
            ]
          }
          EOF
          
          echo "Sending SSM command..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --cli-input-json file://ssm_payload.json \
            --comment "Diagnostic checks" \
            --query "Command.CommandId" \
            --output text)
            
          echo "Command ID: $COMMAND_ID"
          
          echo "Waiting for command execution..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true
            
          echo "Retrieving output..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
